<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title subtitle">
  <title id="title">Hi, I'm Malaak</title>
  <desc id="subtitle">Maker · Developer · Researcher — Malé, Maldives</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071422"/>
      <stop offset="38%" stop-color="#0D1B2A"/>
      <stop offset="68%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0D1B2A" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0D1B2A" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="22%" r="28%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0D1B2A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Self-contained backdrop so the banner reads clearly on both GitHub light and dark pages -->
  <rect width="1200" height="300" fill="url(#ocean)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- Soft moon -->
  <circle cx="1040" cy="64" r="26" fill="#E0F2FE" fill-opacity="0.85"/>
  <circle cx="1050" cy="56" r="20" fill="#0D1B2A" fill-opacity="0.18"/>

  <!-- Distant stars -->
  <g fill="#E0F2FE">
    <circle cx="80" cy="40" r="1.6" fill-opacity="0.7"/>
    <circle cx="150" cy="70" r="1.2" fill-opacity="0.5"/>
    <circle cx="230" cy="32" r="1.4" fill-opacity="0.65"/>
    <circle cx="320" cy="58" r="1.1" fill-opacity="0.45"/>
    <circle cx="900" cy="36" r="1.3" fill-opacity="0.6"/>
    <circle cx="960" cy="88" r="1.1" fill-opacity="0.45"/>
    <circle cx="1120" cy="48" r="1.5" fill-opacity="0.7"/>
    <circle cx="1160" cy="90" r="1.2" fill-opacity="0.5"/>
  </g>

  <!-- Subtle waves -->
  <path fill="url(#wave1)" d="M0,198 C140,178 240,228 380,208 C520,188 620,238 760,214 C900,190 1040,230 1200,204 L1200,300 L0,300 Z"/>
  <path fill="url(#wave2)" d="M0,228 C160,212 280,252 440,236 C600,220 720,258 880,240 C1040,222 1120,250 1200,236 L1200,300 L0,300 Z"/>
  <path fill="none" stroke="#E0F2FE" stroke-opacity="0.28" stroke-width="1.5" d="M0,228 C160,212 280,252 440,236 C600,220 720,258 880,240 C1040,222 1120,250 1200,236"/>

  <!-- Type -->
  <text x="600" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#F0F9FF">Hi, I&apos;m Malaak</text>
  <rect x="510" y="142" width="180" height="3" rx="1.5" fill="#38BDF8" fill-opacity="0.9"/>
  <text x="600" y="184" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#BAE6FD">Maker · Developer · Researcher — Malé, Maldives</text>
</svg>
