<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
  <title id="title">Featured websites</title>
  <desc>Animated ocean banner for a collection of websites</desc>
  <defs>
    <clipPath id="frame">
      <rect width="1200" height="300"/>
    </clipPath>
    <linearGradient id="ocean" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#071422"/>
      <stop offset="36%" stop-color="#0D1B2A"/>
      <stop offset="68%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0D1B2A" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0D1B2A" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="waveC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#164E63" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0D1B2A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="-480" y1="0" x2="0" y2="40">
      <stop offset="0" stop-color="#F0F9FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0F2FE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F0F9FF" stop-opacity="0"/>
      <animate attributeName="x1" values="-480;1200" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1680" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#ocean)"/>

    <!-- Pulsing moonlight -->
    <circle cx="1040" cy="64" r="70" fill="url(#moonGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="64" r="26" fill="#E0F2FE" fill-opacity="0.92"/>
    <circle cx="1050" cy="56" r="20" fill="#0D1B2A" fill-opacity="0.16"/>

    <!-- Twinkling stars -->
    <g fill="#E0F2FE">
      <circle cx="80" cy="40" r="1.6">
        <animate attributeName="opacity" values="0.35;0.95;0.35" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="70" r="1.2">
        <animate attributeName="opacity" values="0.25;0.8;0.25" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="230" cy="32" r="1.4">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="320" cy="58" r="1.1">
        <animate attributeName="opacity" values="0.2;0.75;0.2" dur="2.9s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="410" cy="24" r="1.3">
        <animate attributeName="opacity" values="0.3;0.85;0.3" dur="3.4s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="46" r="1.15">
        <animate attributeName="opacity" values="0.25;0.8;0.25" dur="4.1s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="680" cy="30" r="1.25">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="780" cy="62" r="1.1">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.7s" begin="1.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="36" r="1.3">
        <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3.6s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="960" cy="88" r="1.1">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="48" r="1.5">
        <animate attributeName="opacity" values="0.35;0.95;0.35" dur="3.1s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1160" cy="90" r="1.2">
        <animate attributeName="opacity" values="0.25;0.8;0.25" dur="2.8s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Soft shimmer across the sky and water -->
    <rect width="1200" height="300" fill="url(#shimmer)"/>

    <!-- Layered waves: each strip is 2400 wide and loops by -1200 -->
    <g>
      <path fill="url(#waveA)" d="M0,176 C150,156 250,206 400,186 C550,166 650,216 800,190 C950,164 1050,206 1200,176 C1350,156 1450,206 1600,186 C1750,166 1850,216 2000,190 C2150,164 2250,206 2400,176 L2400,300 L0,300 Z"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="18s" repeatCount="indefinite"/>
    </g>
    <g>
      <path fill="url(#waveB)" d="M0,204 C160,184 270,234 420,214 C570,194 680,242 830,220 C980,198 1090,238 1200,204 C1360,184 1470,234 1620,214 C1770,194 1880,242 2030,220 C2180,198 2290,238 2400,204 L2400,300 L0,300 Z"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <path fill="url(#waveC)" d="M0,236 C140,220 260,258 400,242 C540,226 660,266 800,248 C940,230 1080,262 1200,236 C1340,220 1460,258 1600,242 C1740,226 1860,266 2000,248 C2140,230 2280,262 2400,236 L2400,300 L0,300 Z"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="8s" repeatCount="indefinite"/>
    </g>
    <g fill="none" stroke="#E0F2FE" stroke-opacity="0.28" stroke-width="1.5">
      <path d="M0,236 C140,220 260,258 400,242 C540,226 660,266 800,248 C940,230 1080,262 1200,236 C1340,220 1460,258 1600,242 C1740,226 1860,266 2000,248 C2140,230 2280,262 2400,236"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="8s" repeatCount="indefinite"/>
    </g>

    <!-- Floating bubbles -->
    <g fill="#E0F2FE">
      <circle cx="90" r="3.2" fill-opacity="0.45">
        <animate attributeName="cy" values="290;70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="90;110;90" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.12;0.78;1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" r="2.2" fill-opacity="0.4">
        <animate attributeName="cy" values="300;90" dur="11s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="180;165;180" dur="11s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.12;0.78;1" dur="11s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="310" r="4" fill-opacity="0.4">
        <animate attributeName="cy" values="295;60" dur="13s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="310;335;310" dur="13s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.48;0.48;0" keyTimes="0;0.1;0.8;1" dur="13s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="470" r="2.6" fill-opacity="0.42">
        <animate attributeName="cy" values="300;80" dur="8.5s" begin="2.2s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="470;455;470" dur="8.5s" begin="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.12;0.78;1" dur="8.5s" begin="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" r="3.4" fill-opacity="0.4">
        <animate attributeName="cy" values="292;55" dur="12s" begin="3.1s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="640;660;640" dur="12s" begin="3.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.46;0.46;0" keyTimes="0;0.1;0.8;1" dur="12s" begin="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" r="2.3" fill-opacity="0.42">
        <animate attributeName="cy" values="298;95" dur="9.8s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="790;775;790" dur="9.8s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.12;0.78;1" dur="9.8s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="930" r="3.8" fill-opacity="0.38">
        <animate attributeName="cy" values="300;70" dur="14s" begin="2.8s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="930;955;930" dur="14s" begin="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.44;0.44;0" keyTimes="0;0.1;0.8;1" dur="14s" begin="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" r="2.5" fill-opacity="0.4">
        <animate attributeName="cy" values="294;85" dur="10.5s" begin="1.7s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="1080;1065;1080" dur="10.5s" begin="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.48;0.48;0" keyTimes="0;0.12;0.78;1" dur="10.5s" begin="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1180" r="3" fill-opacity="0.36">
        <animate attributeName="cy" values="300;75" dur="11.6s" begin="4s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="1180;1165;1180" dur="11.6s" begin="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.42;0.42;0" keyTimes="0;0.12;0.78;1" dur="11.6s" begin="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="250" r="1.8" fill-opacity="0.5">
        <animate attributeName="cy" values="288;110" dur="7.5s" begin="3.6s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="250;262;250" dur="7.5s" begin="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.15;0.75;1" dur="7.5s" begin="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
