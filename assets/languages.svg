<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="495" height="215" viewBox="0 0 495 215" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#12183A"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5865F2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0"/>
    </linearGradient>
    <style>
      .f { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    </style>
    <clipPath id="cardClip">
      <rect width="495" height="215" rx="16"/>
    </clipPath>
  </defs>
  <rect width="495" height="215" rx="16" fill="url(#cardBg)" stroke="#5865F2" stroke-opacity="0.55" stroke-width="1.5"/>
  <g clip-path="url(#cardClip)">
  <rect x="28" y="0.75" width="439" height="2" rx="1" fill="url(#topGlow)"/>
  <text class="f" x="22" y="32" fill="#5865F2" font-size="16" font-weight="700">Most Used Languages</text>

  <g>
    <text class="f" x="22" y="62" fill="#E8ECF8" font-size="13" font-weight="600">HTML</text>
    <text class="f" x="473" y="62" fill="#A5B4FC" font-size="12" text-anchor="end">31.9%</text>
    <rect x="22" y="70" width="451" height="8" rx="4" fill="#1A2152"/>
    <rect x="22" y="70" width="143.7" height="8" rx="4" fill="#5865F2">
      <animate attributeName="width" from="0" to="143.7" dur="0.9s" begin="0.15s" fill="freeze"/>
    </rect>
  </g>
  <g>
    <text class="f" x="22" y="90" fill="#E8ECF8" font-size="13" font-weight="600">JavaScript</text>
    <text class="f" x="473" y="90" fill="#A5B4FC" font-size="12" text-anchor="end">28.8%</text>
    <rect x="22" y="98" width="451" height="8" rx="4" fill="#1A2152"/>
    <rect x="22" y="98" width="129.7" height="8" rx="4" fill="#7B85F5">
      <animate attributeName="width" from="0" to="129.7" dur="0.9s" begin="0.23s" fill="freeze"/>
    </rect>
  </g>
  <g>
    <text class="f" x="22" y="118" fill="#E8ECF8" font-size="13" font-weight="600">CSS</text>
    <text class="f" x="473" y="118" fill="#A5B4FC" font-size="12" text-anchor="end">20.0%</text>
    <rect x="22" y="126" width="451" height="8" rx="4" fill="#1A2152"/>
    <rect x="22" y="126" width="90.3" height="8" rx="4" fill="#9AA3FB">
      <animate attributeName="width" from="0" to="90.3" dur="0.9s" begin="0.31s" fill="freeze"/>
    </rect>
  </g>
  <g>
    <text class="f" x="22" y="146" fill="#E8ECF8" font-size="13" font-weight="600">TypeScript</text>
    <text class="f" x="473" y="146" fill="#A5B4FC" font-size="12" text-anchor="end">12.7%</text>
    <rect x="22" y="154" width="451" height="8" rx="4" fill="#1A2152"/>
    <rect x="22" y="154" width="57.4" height="8" rx="4" fill="#A5B4FC">
      <animate attributeName="width" from="0" to="57.4" dur="0.9s" begin="0.39s" fill="freeze"/>
    </rect>
  </g>
  <g>
    <text class="f" x="22" y="174" fill="#E8ECF8" font-size="13" font-weight="600">Python</text>
    <text class="f" x="473" y="174" fill="#A5B4FC" font-size="12" text-anchor="end">6.6%</text>
    <rect x="22" y="182" width="451" height="8" rx="4" fill="#1A2152"/>
    <rect x="22" y="182" width="29.9" height="8" rx="4" fill="#C7D2FE">
      <animate attributeName="width" from="0" to="29.9" dur="0.9s" begin="0.47s" fill="freeze"/>
    </rect>
  </g>
  <text class="f" x="22" y="200" fill="#9AA3C2" font-size="10">From public, non-fork repositories</text>
  </g>
</svg>
