<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="495" height="215" viewBox="0 0 495 215" role="img" aria-label="Contribution Streak">
  <title>Contribution Streak</title>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#12183A"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5865F2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0"/>
    </linearGradient>
    <style>
      .f { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    </style>
    <clipPath id="cardClip">
      <rect width="495" height="215" rx="16"/>
    </clipPath>
  </defs>
  <rect width="495" height="215" rx="16" fill="url(#cardBg)" stroke="#5865F2" stroke-opacity="0.55" stroke-width="1.5"/>
  <g clip-path="url(#cardClip)">
  <rect x="28" y="0.75" width="439" height="2" rx="1" fill="url(#topGlow)"/>
  <text class="f" x="22" y="32" fill="#5865F2" font-size="16" font-weight="700">Contribution Streak</text>

  <g text-anchor="middle">

    <text class="f" x="85" y="108" fill="#E8ECF8" font-size="32" font-weight="700">263</text>
    <text class="f" x="85" y="138" fill="#5865F2" font-size="12" font-weight="600">Total contributions</text>
    <text class="f" x="85" y="158" fill="#9AA3C2" font-size="11">Oct 1 – Nov 21</text>
  </g>
  <g text-anchor="middle">
    <circle cx="247" cy="100" r="46" fill="none" stroke="#5865F2" stroke-opacity="0.35" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.25;0.8;0.25" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text class="f" x="247" y="108" fill="#E8ECF8" font-size="32" font-weight="700">25</text>
    <text class="f" x="247" y="138" fill="#5865F2" font-size="12" font-weight="600">Current streak</text>
    <text class="f" x="247" y="158" fill="#9AA3C2" font-size="11">Oct 28 – Nov 21</text>
  </g>
  <g text-anchor="middle">

    <text class="f" x="410" y="108" fill="#E8ECF8" font-size="32" font-weight="700">25</text>
    <text class="f" x="410" y="138" fill="#5865F2" font-size="12" font-weight="600">Longest streak</text>
    <text class="f" x="410" y="158" fill="#9AA3C2" font-size="11">Oct 28 – Nov 21</text>
  </g>
  <line x1="165" y1="62" x2="165" y2="180" stroke="#5865F2" stroke-opacity="0.22"/>
  <line x1="330" y1="62" x2="330" y2="180" stroke="#5865F2" stroke-opacity="0.22"/>
  </g>
</svg>
